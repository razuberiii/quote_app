    homepage:
      meta_title: Rubusoo | Export quotation software for closing deals
      meta_description: Rubusoo helps export teams manage quotes, revisions, buyer response, and follow-up in one clear record. Share online, keep version control, and still export PDF or Excel.
      workflow_steps:
        - number: "01"
          title: Create a structured quote
          body: Build from products, specs, pricing, and trade terms in one record.
          emphasis: false
        - number: "02"
          title: Revise without confusion
          body: Keep revision lineage clear instead of creating disconnected files.
          emphasis: true
        - number: "03"
          title: Share one live quote
          body: Send one online quote link that always shows the latest version.
          emphasis: true
        - number: "04"
          title: Follow up with context
          body: Use views and revision activity to follow up at the right time.
          emphasis: false
      capability_cards:
        - title: Revision control
          body: Keep every version in one quote record so the current version is always clear.
        - title: Shared online quote
          body: Replace attachment back-and-forth with one live quote page buyers can review and respond to.
        - title: Buyer activity
          body: Keep views, revision requests, and follow-up activity tied to the same quote record.
        - title: PDF and Excel exports
          body: Export the files your team needs without losing track of the latest version.
      context_cards:
        - title: Viewed 18 min after send
          body: Buyer activity appears on the customer timeline with the quote attached.
        - title: Revision requested on V2
          body: Change requests stay with the same quote instead of getting lost across email threads.
        - title: Reminder due today
          body: The rep sees the next follow-up with the right context and timing.
      trust_evidence:
        - source: Quote detail
          signal: Revision V3 became current 2 hours ago
          decision: Rep replies from the latest version, not an old file.
          cta: View demo workspace
        - source: Shared quote
          signal: Buyer can accept or request revision on the quote page
          decision: Buyer responses stay tied to the quote.
          cta: View sample quote
        - source: Buyer activity
          signal: Viewed, revised, and reminded events are timestamped
          decision: Team knows who needs contact now.
          cta: See customer context
      hero:
        kicker: QUOTATION MANAGEMENT FOR EXPORT TEAMS
        title: Make every quote the starting point of a deal.
        body: Rubusoo keeps quotes, revisions, buyer response, and follow-up in one clear record instead of scattering progress across files and threads.
        helper: Built for export teams that send quotes, manage changes, and keep deals moving every day.
        preview_shell_title: Product Preview
        preview_slots:
          - label: Demo Workspace
            body: Quote record, buyer activity, and follow-up queue
            slot: hero-demo-workspace
          - label: Buyer-facing Quote
            body: Live quote page your buyer opens
            slot: hero-online-quote
          - label: Revision / Status
            body: Version changes, status flow, and buyer signals
            slot: hero-revision-status
        cta_primary: Start free
        cta_demo: View demo workspace
        cta_sample: View sample quote
        cta_support: No signup required. See the full flow first.
