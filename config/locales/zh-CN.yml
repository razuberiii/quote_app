        workflow_matters:
          title: 为什么流程在出口报价中重要
          summary: 没有流程结构，报价执行质量会下降。
          paragraph: 出口团队每天都要处理修订、澄清与跟进。这些工作一旦分散，决策效率和转化质量都会下降。
          item_1: 以清晰顺序管理报价修订
          item_2: 通过单一当前版本保持客户可见性
          item_3: 让跟进动作直接绑定报价状态。
          item_4: 在销售与管理之间维持一致执行
        revision_control:
          title: 报价修订控制：核心执行层
          summary: 修订控制是出口报价管理的核心能力。
          paragraph: 谈判中价格与条款高频变化，每次变化都需要可见性、责任归属和清晰沟通。
          item_1: 按上下文追踪每次修订，而非仅看文件名。
          item_2: 让内部评审和买家反馈对齐到同一时间线。
          item_3: 减少谈判中的价格与版本错误。
          item_4: 从文档更新升级为可控执行。
          closing: 这构成了出口团队报价管理的实际运作基础。
        buyer_visibility:
          title: 在线共享报价能提升清晰度和信任感
          summary: 共享报价链接可以从一开始就减少版本混乱。
          paragraph: 附件式更新难以确认当前状态。单一在线报价链接可以在每次修订中持续呈现当前版本。
          item_1: 降低“最终版本是哪一份”的混淆。
          item_2: 缩短跨时区反馈周期。
          item_3: 以一致展示提升信任。
        follow_up_workflow:
          title: 出口销售的跟进流程
          summary: 商机推进取决于与报价状态绑定的持续跟进。
          paragraph: 报价管理系统应将提醒与下一步动作直接关联到实时报价进度。
          item_1: 按报价阶段分配下一动作责任。
        fit:
          connected:
            title: 更适合高频报价、修订和跟进的出口团队。
            body: 客户动作与报价状态始终连在一起，团队协作和交接更稳定。
          outcome:
            title: 报价推进更连贯，成交节奏更可控。
            body: 发送后不再失联于附件与邮件，关键流程打通，复盘也更容易。
        related:
          kicker: 继续阅读
          title: 继续看和报价修订、买家查看与出口跟进直接相关的页面。
