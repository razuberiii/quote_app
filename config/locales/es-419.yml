        explainer:
          title: "¿Qué es un software de cotización de comercio exterior?"
          intro: Una explicación práctica para operaciones de ventas enfocadas en la exportación.
          summary: El software de cotización de comercio exterior ayuda a los equipos de exportación B2B a controlar las revisiones, mejorar la visibilidad del comprador y realizar seguimientos de cotizaciones más rápidos sin la pesada sobrecarga de un ERP.
          key_1: Reemplaza hojas de cálculo y archivos adjuntos fragmentados con un flujo de trabajo de cotización estructurado.
          key_2: Soporta el control de revisión de cotizaciones y enlaces en vivo para el comprador en la ejecución diaria de ventas.
          key_3: Mantiene la gestión de cotizaciones de exportación práctica con salida profesional en PDF/Excel.
          read_full: Leer explicación completa
          need_title: Por qué los equipos de exportación lo necesitan
          need_p1: El software de cotización de comercio exterior es la capa de ejecución entre las discusiones de leads y la confirmación final del comprador en ventas internacionales.
          need_p2: Para los equipos de exportación B2B, cotizar no es solo la creación de documentos. Es la gestión de revisiones, la comunicación con el comprador y el control de seguimiento dentro de un flujo de trabajo comercial.
          breaks_title: Por qué la cotización con hojas de cálculo falla a escala
          breaks_p1: Muchos equipos comienzan con hojas de cálculo, hilos de correo electrónico y cadenas de archivos adjuntos. Eso puede funcionar al principio, pero el volumen rápidamente crea confusión de versiones.
          breaks_1: No hay una única fuente de verdad cuando las cotizaciones se mueven entre compañeros de equipo.
          breaks_2: El historial de revisiones se fragmenta entre archivos y mensajes.
          breaks_3: Los compradores comparan archivos adjuntos antiguos en lugar de la última oferta.
          crm_title: Lo que debe hacer un CRM de cotización práctico
          crm_p1: Excel sigue siendo útil para el análisis, pero es débil para la gestión de cotizaciones de exportación en vivo. El ERP puede proporcionar una gobernanza profunda, pero muchos exportadores lo encuentran demasiado pesado para la velocidad de cotización de primera línea.
          crm_p2: "Los equipos necesitan un flujo de trabajo de CRM de cotización equilibrado: rápido para la negociación diaria, estructurado para una ejecución interna confiable."
          crm_1: Rastrea las revisiones claramente y mantén cada versión visible.
          crm_2: Comparte un enlace de cotización en vivo para el comprador para evitar confusiones.
          crm_3: Exporte archivos profesionales PDF/Excel sin trabajo manual adicional.
          crm_p3: Rubusoo está diseñado para esa brecha exacta. Ofrece a los equipos de exportación B2B una comunicación más clara con el comprador, menos errores evitables y una disciplina de seguimiento más sólida a lo largo del ciclo de vida de la cotización.
