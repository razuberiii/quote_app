<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Server Error | Rubusoo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", "Noto Sans", Arial, sans-serif;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
        color: #0f172a;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.2rem;
      }
      .card {
        width: min(680px, 100%);
        background: #fff;
        border: 1px solid #dbe3ee;
        border-radius: 14px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.09);
        padding: 1.4rem 1.3rem;
      }
      .kicker {
        color: #64748b;
        font-size: 0.76rem;
        letter-spacing: 0.07em;
        font-weight: 700;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.42rem 0 0.45rem;
        font-size: clamp(1.25rem, 2.1vw, 1.8rem);
      }
      p {
        margin: 0.45rem 0;
        color: #334155;
        line-height: 1.5;
      }
      .actions {
        margin-top: 1rem;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      a {
        text-decoration: none;
        border-radius: 10px;
        padding: 0.5rem 0.8rem;
        font-weight: 700;
        font-size: 0.9rem;
        border: 1px solid #94a3b8;
        color: #1e293b;
        background: #fff;
      }
      a.primary {
        background: #1f3650;
        border-color: #1f3650;
        color: #fff;
      }
      .version {
        margin-top: 1rem;
        font-size: 0.74rem;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <div class="kicker">Rubusoo</div>
      <h1>500 - Server Error</h1>
      <p>Something went wrong while processing this request.</p>
      <p>
        Please try again in a moment. If this keeps happening, contact support.
      </p>
      <div class="actions">
        <a class="primary" href="/">Back to Home</a>
      </div>
      <div class="version">v0.94 Beta</div>
    </section>
  </body>
</html>
