name: Visual Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quote_app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/quote_app_test
      VISUAL_BASE_URL: http://127.0.0.1:3100
      GITHUB_SHA: ${{ github.sha }}
      RAILS_SERVE_STATIC_FILES: "1"

    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser and runtime dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node -e 'process.stdout.write(`CHROME_BIN=${require("playwright").chromium.executablePath()}\n`)' >> "$GITHUB_ENV"
      - name: Prepare deterministic visual-review database
        run: |
          mkdir -p tmp/storage tmp/visual-review
          bundle exec rails db:prepare
          SECRET_KEY_BASE_DUMMY=1 bundle exec rails assets:precompile
          bundle exec rails visual_review:seed
      - name: Start Rubusoo test server
        run: |
          bundle exec rails server -b 127.0.0.1 -p 3100 > tmp/visual-review-server.log 2>&1 &
          for attempt in {1..40}; do curl --fail --silent http://127.0.0.1:3100/up && break; sleep 1; done
      - name: Run visual, motion, quality and accessibility review
        run: |
          npx playwright test test/visual/visual_review.spec.js
          npx playwright test test/visual/full_site_audit.spec.js
          npx playwright test test/visual/signature_motion.spec.js
          npx playwright test test/visual/business_flow.spec.js
      - name: Build full-site contact sheets
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p tmp/visual-review/contact-sheets
          montage tmp/visual-review/full-site/screenshots/*-1440.png -thumbnail '360x240^' -gravity north -extent 360x240 -tile 4x -geometry +12+24 -background '#080a0f' -fill white -pointsize 12 -set label '%t' tmp/visual-review/contact-sheets/desktop.jpg
          mapfile -t mobile_shots < <(find tmp/visual-review/full-site/screenshots -type f \( -name '*-390.png' -o -name '*-360.png' -o -name '*-412.png' \) ! -name 'long-quote-*' | sort)
          montage "${mobile_shots[@]}" -thumbnail '190x340^' -gravity north -extent 190x340 -tile 6x -geometry +12+24 -background '#080a0f' -fill white -pointsize 12 -set label '%t' tmp/visual-review/contact-sheets/mobile.jpg
      - name: Generate immutable output evidence
        if: always()
        run: bundle exec rails visual_review:evidence
      - name: Verify audit evidence is substantive
        if: always()
        run: |
          test -s tmp/visual-review/generated/po-comparison-report.json
          test -s tmp/visual-review/generated/returned-excel-difference-report.json
          test -n "$(find tmp/visual-review/generated -name '*.pdf' -size +1000c -print -quit)"
          test -n "$(find tmp/visual-review/generated -name '*.xlsx' -size +1000c -print -quit)"
          ruby -rjson -e 'abort "empty PO diff" if JSON.parse(File.read("tmp/visual-review/generated/po-comparison-report.json"))["changes"].to_a.empty?'
          ruby -rjson -e 'abort "empty Excel diff" if JSON.parse(File.read("tmp/visual-review/generated/returned-excel-difference-report.json"))["changes"].to_a.empty?'
      - name: Upload complete visual audit evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rubusoo-visual-review-${{ github.sha }}
          path: |
            tmp/visual-review/
            tmp/visual-review-server.log
          retention-days: 30
          if-no-files-found: error
