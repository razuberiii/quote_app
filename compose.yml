services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: quote_app
      POSTGRES_DB: quote_app_production
    volumes:
      - /opt/data/quoteapp/postgres:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/10-rubusoo-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote_app -d quote_app_production"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    image: ${RUBUSOO_IMAGE:-rubusoo:latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: db
    volumes:
      - /opt/data/quoteapp/storage:/rails/storage
    ports:
      - "127.0.0.1:3848:80"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *logging

  worker:
    image: ${RUBUSOO_IMAGE:-rubusoo:latest}
    restart: unless-stopped
    command: ["./bin/jobs"]
    env_file: .env.production
    environment: { DB_HOST: db }
    volumes:
      - /opt/data/quoteapp/storage:/rails/storage
    depends_on:
      web: { condition: service_healthy }
    logging: *logging
