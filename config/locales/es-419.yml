        workflow_matters:
          title: Por qué el flujo de trabajo es importante en la cotización de exportación
          summary: Sin una estructura de flujo de trabajo, la calidad de ejecución de las cotizaciones disminuye.
          paragraph: Los equipos de exportación manejan revisiones, aclaraciones y seguimientos a diario. La coordinación fragmentada ralentiza las decisiones y debilita el ritmo de conversión.
          item_1: Mantenga las revisiones de cotizaciones organizadas en una línea de tiempo de ejecución clara.
          item_2: Mantenga la visibilidad para el comprador con una vista de cotización actual.
          item_3: Conecte las acciones de seguimiento directamente al estado de la cotización.
          item_4: Mejore la consistencia de la ejecución entre representantes y gerentes.
        revision_control:
          title: Control de revisión de cotizaciones como capa central de ejecución
          summary: El control de revisión de cotizaciones es la columna vertebral del CRM de cotizaciones de exportación.
          paragraph: En negociaciones activas, los precios y términos cambian con frecuencia. Cada cambio necesita visibilidad, responsabilidad y una comunicación clara con el comprador.
          item_1: Rastree cada revisión con contexto, no solo nombres de archivo.
          item_2: Alinee la revisión interna y la respuesta del comprador en torno a una línea de tiempo.
          item_3: Reduzca los errores de precios y versiones durante la negociación.
          item_4: Pase de las actualizaciones de documentos a una ejecución controlada.
          closing: Esta es la capa de ejecución práctica detrás del CRM de cotizaciones para equipos de exportación.
        buyer_visibility:
          title: El enlace de cotización visible para el comprador mejora la visibilidad y la confianza.
          summary: Los enlaces de cotización visibles para el comprador eliminan la ambigüedad de la versión de inmediato.
          paragraph: Las actualizaciones basadas en archivos adjuntos generan dudas sobre lo que está vigente. Un único enlace de cotización en vivo mantiene la visibilidad del comprador consistente en todas las revisiones.
          item_1: Reduzca la confusión sobre qué versión de cotización es la final.
          item_2: Acelere los ciclos de respuesta del comprador a través de las zonas horarias.
          item_3: Genere confianza a través de una presentación de cotizaciones consistente.
        follow_up_workflow:
          title: Flujo de trabajo de seguimiento para ventas de exportación
          summary: El impulso del negocio depende de la disciplina de seguimiento vinculada al estado de la cotización.
          paragraph: Un CRM de cotizaciones basado en flujo de trabajo debe conectar recordatorios y próximas acciones directamente a la progresión de la cotización en vivo.
          item_1: Asigne la responsabilidad de la próxima acción vinculada a la etapa de la cotización.
          item_2: Utilice una cadencia de recordatorios vinculada a los eventos de revisión.
          item_3: Rastree claramente el estado de las cotizaciones enviadas, pendientes y actualizadas.
          item_4: Proporcione a los gerentes señales de ejecución más claras en todas las oportunidades.
