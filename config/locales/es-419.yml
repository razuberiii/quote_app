          title: Continúa con páginas que muestran cómo se conectan el CRM de cotizaciones, las revisiones y la visibilidad para el comprador.
          cta_vs_erp: Software de cotización vs ERP
          cta_vs_excel: Software de cotización vs Excel
          cta_foreign_trade: Software de cotización para exportación
          item_2: Utilice una cadencia de recordatorios vinculada a los eventos de revisión.
          item_3: Rastree claramente el estado de las cotizaciones enviadas, pendientes y actualizadas.
          item_4: Dé a los gerentes una visibilidad más clara de lo que pasa en cada oportunidad.
        rubusoo_positioning:
          title: Rubusoo como CRM de cotizaciones para exportación.
          summary: Rubusoo convierte el trabajo de cotización en un sistema de ejecución controlado.
          paragraph_prefix: Está diseñado para operaciones de CRM de cotizaciones de exportación donde la velocidad de revisión y la calidad del seguimiento deciden los resultados, mientras se alinea con
          paragraph_link: fundamentos del software de cotizaciones de comercio exterior
          item_1_label: CRM de cotizaciones de exportación
          item_1_detail: diseñado para la ejecución de ventas transfronterizas.
          item_2_label: Control de revisión de cotizaciones
          item_2_detail: línea de tiempo visible con una coordinación de equipo más limpia.
          item_3_label: Enlace de cotización en línea
          item_3_detail: visibilidad de la última versión con baja fricción.
          item_4_label: Seguimiento para equipos de exportación
          item_4_detail: acciones conectadas al estado de la cotización.
          closing: Una mejor calidad de ejecución da a los equipos mayor control y menos fricción de coordinación interna.
        mini_panel:
          claim_title: "¿Qué afirma esta página?"
          claim_body: Rubusoo gestiona revisiones, visibilidad para el cliente y seguimiento alrededor de cada registro de cotización.
          non_claim_title: "¿Qué no afirma esta página?"
          non_claim_body: No pretende que cada interacción con el comprador pueda medirse si su equipo trabaja principalmente a través de PDF y correo electrónico.
        faq:
          title: Preguntas Frecuentes
          q1: "¿En qué se diferencia un CRM de cotizaciones para equipos de exportación de un CRM normal?"
          a1: "Se centra en la ejecución de cotizaciones: revisiones, visibilidad del comprador y seguimiento directamente vinculados al progreso de la cotización."
          q2: "¿Rubusoo admite el control de revisiones de cotizaciones para negociaciones activas?"
          a2: Sí. Las revisiones se registran con una secuencia clara para que el equipo pueda gestionar los cambios del comprador con seguridad.
          q3: "¿Pueden los compradores ver las cotizaciones a través de un enlace de cotización para el comprador?"
          a3: Sí. Los compradores pueden acceder directamente a la última cotización, lo que mejora la claridad y acorta los ciclos de respuesta.
          q4: "¿Rubusoo admite el seguimiento para equipos de ventas de exportación?"
          a4: Sí. Las acciones de seguimiento se vinculan al estado de la cotización para responder con el momento adecuado.
        cta:
          title: Mejore la ejecución de cotizaciones y el impulso comercial
          body: Usa un CRM de cotizaciones para exportación con mejor control de revisiones, visibilidad para el cliente y seguimiento en un solo sistema.
      quick_export_quotation:
        meta:
          title: Exportación rápida de cotización | Rubusoo
          description: Completa la primera cotización más rápido, mantén activo el registro online y sigue entregando PDF o Excel según haga falta.
        hero:
          kicker: EXPORTACIÓN RÁPIDA DE COTIZACIÓN
          title: Termina la primera cotización más rápido y luego entrégala en el formato adecuado
          body: Mantén el registro de cotización activo online y sigue exportando PDF y Excel cuando haga falta. Cada comprador puede recibir el formato que mejor le funcione.
        showcase:
          kicker: OPCIONES DE EXPORTACIÓN
          title: PDF y Excel siguen disponibles
          body: Una sola cotización puede servir al mismo tiempo para la revisión del comprador, el traspaso interno y la entrega basada en archivos. Las plantillas de exportación también se pueden ajustar según tu flujo real de trabajo.
          pdf_title: Cotización en PDF
          excel_title: Cotización en Excel
