            detail: 销售动作与报价生命周期真实状态保持同步。
        preview:
          kicker: 报价推进
          title: 围绕报价推进客户，而不是只做客户档案
          body: 谁看过、什么时候改过、下一步跟进什么，都能直接接在同一条报价记录上。
        toc:
          title: 本页目录
          workflow_matters: 为什么清晰流程对出口报价很重要
          revision_control: 报价修订控制作为核心层
