          item_3: 清晰跟踪已发出、待处理和已更新状态。
          item_4: 为管理者提供更清晰执行信号。
        rubusoo_positioning:
          title: Rubusoo：流程化出口报价 CRM
          summary: Rubusoo 将报价工作转化为可控执行系统。
          paragraph_prefix: 它面向出口报价管理场景，在强调修订效率和跟进质量的同时，仍与
          paragraph_link: 外贸报价软件基础能力
          item_1_label: 出口报价 CRM
          item_1_detail: 面向跨境销售执行打造。
          item_2_label: 报价修订控制
          item_2_detail: 可见时间线让团队协作更清晰。
          item_3_label: 在线报价链接
          item_3_detail: 低摩擦获取最新版本可见性。
          item_4_label: 出口销售跟进流程
          item_4_detail: 动作与报价状态保持联动。
          closing: 更高的执行质量意味着更强的过程控制与更少的内部协作摩擦。
        mini_panel:
          claim_title: 本页明确主张
          claim_body: Rubusoo 围绕每条报价记录管理修订、客户可见性与后续跟进。
          non_claim_title: 本页不做夸大
          non_claim_body: 如果团队主要通过 PDF 与邮件协作，本页不声称能完整量化每次买家互动。
        faq:
          title: 常见问题
          q1: 出口团队的报价 CRM 与普通 CRM 有何不同？
          a1: 它聚焦报价执行：修订、客户查看情况和与进度绑定的跟进。
          q2: Rubusoo 是否支持谈判中的修订控制？
          a2: 支持。修订在清晰流程中追踪，团队可更稳地处理买家变更。
          q3: 买家能通过链接查看报价吗？
          a3: 可以。买家可直接访问最新报价，提升清晰度并缩短反馈。
          q4: 支持出口团队的跟进流程吗？
          a4: 支持。跟进行动与报价状态关联，团队可据此把握响应时机。
        cta:
          title: 提升报价跟进质量和商机推进
          body: 采用面向出口团队的报价管理 CRM，在一个系统内强化修订、客户查看情况与跟进执行。
